aid: medhok-hearst-communications
name: MedHOK (Hearst Communications)
description: >-
  MHK (formerly MedHOK), part of Hearst Health, is a healthcare technology company providing a
  unified SaaS platform for health plans and payers. Its CareProminence suite spans utilization
  management, care management, complaints/appeals and grievances, pharmacy management, population
  health and quality management, and interoperability (the MHK Interop Suite), while its
  MarketProminence suite covers enrollment and member maintenance, premium billing, financial
  reconciliation, and member web portals. MHK helps Medicare, Medicaid, and commercial health plans
  streamline operations, ensure regulatory compliance, and improve the member experience. The MHK
  Interop Suite supports FHIR, SMART on FHIR, Da Vinci, and CMS-0057 interoperability requirements.
  MHK publishes HITRUST and ISO 27001 certification and NCQA prevalidation. The company operates a
  public marketing and resource site but does not publish a public developer portal or API program.
